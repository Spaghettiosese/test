<!doctype html><meta charset="utf-8"><title>sheet</title>
<style>body{margin:0;background:#0b1020;color:#fff;font:12px sans-serif}canvas#gl{position:absolute;left:-9999px}#grid{display:flex;flex-wrap:wrap;gap:4px;padding:4px}.c{position:relative}.c b{position:absolute;left:4px;top:2px}</style>
<canvas id="gl" width="300" height="420"></canvas><div id="grid"></div>
<script type="module">
import * as E from '../../engine/index.js';
import { HEROES } from '../src/heroes.js';
import { buildHero, animateHero } from '../src/models.js';
const q = new URLSearchParams(location.search), views = (q.get('views') || 'front,back').split(','), only = q.get('only')?.split(',');
const gl = document.getElementById('gl'), r = new E.Renderer(gl);
Object.assign(r.settings, { adaptiveResolution: false, renderScale: 1, bloom: true, vignette: 0.1, ssr: false, volumetrics: false, godRays: false });
const scene = new E.Scene(), env = scene.environment; E.applyTimeOfDay(env, 14); Object.assign(env, { fogDensity: 0, shadowRadius: 3, shadowFar: 0, volumetric: 0 });
const cam = new E.Camera(); cam.fov = 30 * E.DEG; cam.near = 0.05; cam.aspect = 300 / 420;
const key = new E.Light('point', { color: '#fff3e0', intensity: 30, range: 14 }); key.position.set([2, 3, 3]); scene.add(key);
const rim = new E.Light('point', { color: '#8fb8ff', intensity: 18, range: 14 }); rim.position.set([-2, 2.5, -2]); scene.add(rim);
const grid = document.getElementById('grid');
for (const h of HEROES) {
  if (only && !only.includes(h.id)) continue;
  const m = buildHero(h.id); m.userData.ring.visible = false; scene.add(m); animateHero(m, 1.3, { flying: h.id === 'skyhawk' });
  m.userData.armR.setEuler(-30, 0, -6); m.userData.armL.setEuler(-25, 0, 18);
  for (const v of views) {
    m.setEuler(0, v === 'front' ? 22 : v === 'back' ? 202 : v === 'side' ? 112 : 330, 0);
    const s = h.height / 1.8, cy = 0.95 * s; cam.position.set([0.3, cy + 0.1, 5.2 * s]); cam.target.set([0, cy, 0]);
    env.zenithColor = [0.3, 0.4, 0.6]; env.horizonColor = [0.5, 0.55, 0.65]; env.skyColor = [0.4, 0.5, 0.7];
    r.render(scene, cam, { background: 'sky', shadows: false });
    const c = document.createElement('canvas'); c.width = 300; c.height = 420; c.getContext('2d').drawImage(gl, 0, 0, 300, 420);
    const w = document.createElement('div'); w.className = 'c'; w.append(c); w.insertAdjacentHTML('beforeend', `<b>${h.name} ${v}</b>`); grid.append(w);
    await new Promise((res) => setTimeout(res, 0));
  }
  scene.remove(m);
}
window.__done = true;
</script>
